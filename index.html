<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auditoria Documental DP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky brand bar with view tabs; each view is a single column of
   working sections (ficha = audit form mirroring the spreadsheet, relatório = A4-like document). */
/* Paleta: fundo bege claro com destaques em azul. */
:root{
  color-scheme:light;
  --bg:#F4EFE6; --bg-inset:#EBE4D6; --surface:#FBF8F2; --surface-2:#F1EBDF; --ink:#1F2933; --ink-2:#4B5563; --ink-3:#7C7A72;
  --line:#DDD4C3; --brand:#E1EBF6; --brand-ink:#2A5C99; --teal:#2A5C99; --teal-soft:#E1EBF6; --on-accent:#FFFFFF;
  --ok:#2F7D4E; --ok-soft:#DCEBDD; --info:#2A5C99; --info-soft:#E1EBF6;
  --warn:#9A6200; --warn-soft:#F6E7C8; --bad:#B3392F; --bad-soft:#F5DCD8; --na:#6B7280; --na-soft:#E9E4D8;
  --f-display:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:8px; --shadow:0 1px 2px rgba(60,45,20,.06),0 4px 14px rgba(60,45,20,.06);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.005em}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* menu lateral */
.app{display:flex;min-height:100vh}
.sidebar{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand-header{padding:6px 10px 12px;display:flex;justify-content:center}
.brand-header img{height:52px;width:auto;max-width:100%;object-fit:contain}
.brand-t{font-family:var(--f-display);font-size:15.5px;font-weight:700;padding:0 10px 4px;line-height:1.25;text-align:center;color:var(--ink)}
.brand-sub{font-size:11.5px;color:var(--ink-3);padding:0 10px 18px;letter-spacing:.02em;text-align:center}
.tabs{display:flex;flex-direction:column;gap:2px}
.tabs a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-2);text-decoration:none}
.tabs a svg{flex:0 0 16px;width:16px;height:16px;opacity:.75}
.tabs a:hover{background:var(--bg-inset);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--teal-soft);color:var(--teal);font-weight:600}
.tabs a[aria-current="page"] svg{opacity:1}
.comp{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.comp label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.comp input{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 9px;color-scheme:light}
.content{flex:1 1 auto;min-width:0}

main{padding-block:24px 64px}
.view{display:flex;flex-direction:column;gap:20px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vhead h1{font-size:28px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sec>h2{font-size:18px;display:flex;align-items:baseline;gap:10px}
.sec>h2 .no{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--teal);letter-spacing:.05em}
.sec .hint{font-size:12px;color:var(--ink-2);margin:-6px 0 0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-otimo{color:var(--ok);background:var(--ok-soft)}
.p-bom{color:var(--info);background:var(--info-soft)}
.p-atencao{color:var(--warn);background:var(--warn-soft)}
.p-critico{color:var(--bad);background:var(--bad-soft)}
.p-none{color:var(--na);background:var(--na-soft)}
.p-alta{color:var(--bad);background:var(--bad-soft)}
.p-media{color:var(--warn);background:var(--warn-soft)}
.p-baixa{color:var(--info);background:var(--info-soft)}

/* tables */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--surface-2)}
td.n,th.n{text-align:right}
td.c,th.c{text-align:center}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.heat{display:inline-block;min-width:48px;text-align:right;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums;font-weight:600}
.h-otimo{background:var(--ok-soft);color:var(--ok)}
.h-bom{background:var(--info-soft);color:var(--info)}
.h-atencao{background:var(--warn-soft);color:var(--warn)}
.h-critico{background:var(--bad-soft);color:var(--bad)}
.h-none{color:var(--ink-3)}

/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea.inp{resize:vertical;min-height:62px}
.inp:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.inp:disabled{background:var(--surface-2)}

/* checklist */
.blk{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.blk-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.blk-h b{font-family:var(--f-display);font-size:15px;font-weight:600}
.blk-h .letter{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--teal);color:var(--on-accent);font-family:var(--f-body);font-size:12px;margin-right:8px}
.it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.it:last-child{border-bottom:0}
.it .no{font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:4px}
.it .tx{padding-top:4px}
.it .obs{grid-column:2 / 4}
.it .obs input{font-size:13px}
.it .addnc{grid-column:2 / 4;justify-self:start}
@media (max-width:640px){.it{grid-template-columns:26px minmax(0,1fr)}.it .seg{grid-column:2}.it .obs,.it .addnc{grid-column:2}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12px;min-width:38px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="C"]{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="NC"]{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"][data-v="NA"]{background:var(--na-soft);color:var(--na)}
.seg button:disabled{cursor:not-allowed}

/* list rows (NCs, plano, funcionários) */
.lrows{display:flex;flex-direction:column;gap:10px}
.lrow{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;background:var(--surface-2)}
.lrow .wide{grid-column:1 / -1}
.lrow .rm{justify-self:end}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--ink-2)}

/* fichas list */
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fcard{padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.fcard:hover{border-color:var(--teal)}
.fcard[aria-current="true"]{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.fcard .nm{font-family:var(--f-display);font-size:17px;font-weight:600}
.fcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard .big{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--na-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}

.status{font-size:12px;color:var(--ink-2)}
.status.err{color:var(--bad)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.sticky-sum{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 16px}
.sticky-sum .k{display:flex;flex-direction:column;line-height:1.2}
.sticky-sum .k span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.sticky-sum .k b{font-size:17px;font-variant-numeric:tabular-nums}
@media (max-width:720px){.sticky-sum{position:static}}

/* chart */
.chart svg{width:100%;max-width:720px;height:auto;display:block}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:var(--on-accent)}
@media (max-width:860px){.app{flex-direction:column}.sidebar{position:static;width:auto;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px}.brand-header{justify-content:flex-start;padding-bottom:6px}.brand-t,.brand-sub{text-align:left;padding-left:0;padding-bottom:6px}.tabs{flex-direction:row;flex-wrap:wrap}.comp{flex-direction:row;align-items:center;gap:8px;border-top:0;margin-top:8px;padding-top:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:28px;max-width:920px;margin:0 auto;width:100%}
.rcover{display:flex;flex-direction:column;gap:14px;border-bottom:3px solid var(--brand);padding-bottom:22px}
.rcover .top-r{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rcover img{height:44px;width:auto}
.rcover h1{font-size:clamp(24px,4vw,34px);line-height:1.15}
.rmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;font-size:13px}
.rmeta div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.rsec{display:flex;flex-direction:column;gap:12px}
.rsec h2{font-size:20px;border-bottom:1px solid var(--line);padding-bottom:6px}
.rsec h3{font-size:15px}
.rsec p{margin:0;max-width:70ch}
.rsec table{font-size:13px}
.rsec ul{margin:0;padding-left:20px}
.rfoot{font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;padding-top:30px}
.sig div{border-top:1px solid var(--ink-2);padding-top:6px;font-size:12px;color:var(--ink-2)}
.logo-light{display:inline}.logo-dark{display:none}
.top .logo-light{display:inline}.top .logo-dark{display:none}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px}
.st{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 4px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.02em}
.st-C{background:var(--ok-soft);color:var(--ok)}.st-P{background:var(--warn-soft);color:var(--warn)}.st-NC{background:var(--bad-soft);color:var(--bad)}.st-NA{background:var(--na-soft);color:var(--na)}.st-{color:var(--ink-3)}
table.mx{font-size:13px}
table.mx th.doc{min-width:64px;max-width:96px;text-align:center;text-transform:none;letter-spacing:0;font-size:11px;line-height:1.25;vertical-align:bottom}
table.mx th.doc b{display:block;color:var(--teal);font-size:11px}
table.mx td.cell{text-align:center;padding:6px 4px}
table.mx .stick{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line);min-width:180px}
table.mx th.stick{background:var(--surface-2)}
table.mx tr:hover td{background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:200px}
.svgx{overflow-x:auto}.svgx svg{min-width:560px}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--na-soft);color:var(--ink-2);white-space:nowrap}
.chip.nc{background:var(--bad-soft);color:var(--bad)}.chip.p{background:var(--warn-soft);color:var(--warn)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg2 button+button{border-left:1px solid var(--line)}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters .fld{min-width:150px;flex:1 1 150px;max-width:260px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface)}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.pop{position:absolute;z-index:30;display:flex;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pop button{border:1px solid transparent;cursor:pointer;min-width:38px;height:30px}
.pop button[aria-pressed="true"]{border-color:var(--ink)}
.cellbtn{border:1px solid transparent;cursor:pointer;font:inherit;font-size:11px;font-weight:700}
.cellbtn:hover:not(:disabled){border-color:var(--teal)}
.cellbtn.st-{background:var(--surface-2);border:1px dashed var(--line)}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.linkbtn:hover b{color:var(--teal);text-decoration:underline}
tr.detail td{background:var(--surface-2)}
.det{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:6px 0;max-width:min(980px,calc(100vw - 80px));position:sticky;left:10px}
.seg2 button.bad[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.det .seg2{align-self:flex-start}
@media (max-width:640px){table.mx .stick{min-width:140px;max-width:150px}}
.dwrap{overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dficha{background:#fff;color:#1F2C35;max-width:794px;min-width:620px;margin:0 auto;padding:0 0 28px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px;color-scheme:light}
.dhead{background:#3F5765;display:flex;justify-content:space-between;align-items:center;padding:14px 28px}
.dhead img{height:44px}.dhead span{color:#fff;font-weight:700;letter-spacing:.06em;font-size:15px}
.dtit{font-family:var(--f-body);font-size:15px;text-transform:uppercase;margin:16px 28px 2px;color:#1F2C35}
.dsub{margin:0 28px 10px;font-style:italic;color:#4F6370;font-size:11px}
.dsec{background:#3F5765;color:#fff;font-family:var(--f-body);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;margin:14px 28px 6px;padding:5px 8px}
.dficha .dt{width:calc(100% - 56px);margin:0 28px;border-collapse:collapse;font-size:11.5px}
.dficha .dt th,.dficha .dt td{border:1px solid #C8D0D4;padding:4px 6px;color:#1F2C35;background:#fff;text-transform:none;letter-spacing:0;font-size:11.5px}
.dficha .dt th{background:#F6F8F9;font-weight:600;text-align:left}
.dficha .dt thead th{background:#D6E7EB}
.dficha .dt .n{text-align:right}.dficha .dt .c{text-align:center}
.dficha .dblk td{background:#7FC9D6;font-weight:700}
.dident{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin:0 28px}
.dident .dt{width:100%;margin:0}.dres-box{align-self:start}
.dcrit{margin:0 28px;font-size:11.5px;line-height:1.6}
.dnote{margin:4px 28px 0;font-size:10.5px;font-style:italic;color:#4F6370}
.dres{display:inline-block;min-width:30px;padding:1px 6px;border-radius:3px;font-weight:700;font-size:11px}
.okbox{padding:12px 14px;border-radius:var(--r);background:var(--teal-soft);display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

</head>
<body>

const FAIXAS=[{min:.9,nome:"Ótimo",c:"otimo"},{min:.75,nome:"Bom",c:"bom"},{min:.6,nome:"Atenção",c:"atencao"},{min:0,nome:"Crítico",c:"critico"}];

const EMPRESAS=["CONDOMINIO DO EDIFICIO EMPRESARIAL MARIE CURIE","RESERVA DO PAIVA SPE 03 LTDA","RIO AVE 200 SPE LTDA.","RIO AVE CARNEIROS 01 SPE LTDA.","RIO AVE CIDADE JARDIM SPE LTDA","RIO AVE EQUIPAMENTOS LTDA.","RIO AVE INVESTIMENTOS LTDA","RIO AVE OASIS TORRE 1 SPE LTDA.","RIO AVE POCO DA PANELA SPE LTDA.","RIO AVE SUBHOLDING INCORPORACAO LTDA"];
const STOP=new Set(["rio","ave","spe","ltda","do","da","de","dos","das","condominio","edificio","empresarial","torre"]);
const toks=x=>String(x??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(t=>/^\d+$/.test(t)?String(+t):t);
function empresaDe(nome){if(!nome)return"";const n=String(nome).trim();if(EMPRESAS.includes(n))return n;
  const t=toks(n).filter(x=>!STOP.has(x));if(!t.length)return"";
  const hits=EMPRESAS.filter(e=>{const et=new Set(toks(e));return t.every(x=>et.has(x))});return hits.length===1?hits[0]:""}
const curtoEmp=e=>String(e||"").replace(/\s+(SPE\s+)?LTDA\.?$/i,"").replace(/\s+SPE$/i,"").replace(/^CONDOMINIO DO EDIFICIO EMPRESARIAL /i,"Cond. Emp. ").toLowerCase().replace(/(^|\s)([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Do|Da|De)\b/g,m=>m.toLowerCase()).replace(/\bSpe\b/g,"SPE");
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=v=>v==null||isNaN(v)?"—":(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const pp=v=>v==null||isNaN(v)?"—":(v>0?"+":"")+(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+" p.p.";
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=s=>{if(!s)return"—";const[y,m,d]=s.split("-");return d&&m&&y?`${d}/${m}/${y}`:s};
const compLabel=c=>{if(!c)return"";const[y,m]=c.split("-");const n=MESES[+m-1]||"";return n.charAt(0).toUpperCase()+n.slice(1)+"/"+y};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function addDias(iso,n,uteis){if(!iso)return"";const d=new Date(iso+"T12:00:00");if(!uteis){d.setDate(d.getDate()+n)}else{let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++}}return d.toISOString().slice(0,10)}
const prazoPara=(data,p)=>PRIOR[p]?addDias(data||hoje(),PRIOR[p].dias,PRIOR[p].uteis):"";
const faixa=v=>v==null||isNaN(v)?null:FAIXAS.find(f=>v>=f.min);
const pill=v=>{const f=faixa(v);return f?`<span class="pill p-${f.c}">${f.nome}</span>`:`<span class="pill p-none">Sem dados</span>`};
const heat=v=>{const f=faixa(v);return `<span class="heat h-${f?f.c:"none"}">${pct(v)}</span>`};
const prPill=p=>p?`<span class="pill p-${p==="Alta"?"alta":p==="Média"?"media":"baixa"}">${esc(p)}</span>`:"";
const avg=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};

/* ---------- cálculo (mesma regra da planilha: C ÷ (C+P+NC)) ---------- */
function calc(f){
  const resp=f.resp||{};const out={blocos:{},C:0,P:0,NC:0,NA:0,sem:0};
  for(const b of BLOCOS){const o={C:0,P:0,NC:0,NA:0};for(let i=b.de;i<=b.ate;i++){const r=resp[i];if(o[r]!=null)o[r]++;else out.sem++}
    o.ap=o.C+o.P+o.NC;o.ind=o.ap?o.C/o.ap:null;out.blocos[b.k]=o;out.C+=o.C;out.P+=o.P;out.NC+=o.NC;out.NA+=o.NA}
  out.ap=out.C+out.P+out.NC;out.ind=out.ap?out.C/out.ap:null;
  const ncs=f.ncs||[];out.ncAltas=ncs.filter(n=>n.prioridade==="Alta").length;
  out.ncAbertas=ncs.filter(n=>n.situacao!=="Corrigida").length;
  let ok=0,late=0;const t=hoje();
  for(const n of ncs){if(!n.prazo)continue;if(n.situacao==="Corrigida"){if(n.correcao&&n.correcao>n.prazo)late++;else ok++}else if(t>n.prazo)late++}
  out.noPrazo=ok+late?ok/(ok+late):null;
  return out}
function anterior(f){return state.fichas.filter(x=>x.id!==f.id&&(x.assistente||"").trim().toLowerCase()===(f.assistente||"").trim().toLowerCase()&&(x.competencia||"")<(f.competencia||"")).sort((a,b)=>(b.competencia||"").localeCompare(a.competencia||""))[0]}
function reinc(f){const p=anterior(f);if(!p)return null;let n=0;const r=f.resp||{},q=p.resp||{};for(let i=1;i<=30;i++)if(r[i]==="NC"&&(q[i]==="NC"||q[i]==="P"))n++;return n}

function chartBlocos(rows){
  // rows: [{label, v}] values 0..1
  const W=640,rowH=34,top=20,left=190,right=56,H=top+rows.length*rowH+26,w=W-left-right;
  const x=v=>left+w*v;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Índice por bloco">`;
  for(const t of [0,.25,.5,.75,1])s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top-6}" y2="${H-22}" stroke="var(--line)" stroke-width="1"/><text x="${x(t)}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--ink-3)">${t*100}%</text>`;
  for(const f of FAIXAS.slice(0,3))s+=`<line x1="${x(f.min)}" x2="${x(f.min)}" y1="${top-6}" y2="${H-22}" stroke="var(--${f.c==="otimo"?"ok":f.c==="bom"?"info":"warn"})" stroke-dasharray="3 3" stroke-width="1"/>`;
  rows.forEach((r,i)=>{const y=top+i*rowH;const fx=faixa(r.v);const col=fx?`var(--${fx.c==="otimo"?"ok":fx.c==="bom"?"info":fx.c==="atencao"?"warn":"bad"})`:"var(--na)";
    s+=`<text x="${left-10}" y="${y+rowH/2+4}" font-size="12" text-anchor="end" fill="var(--ink)">${esc(r.label)}</text>`;
    s+=`<rect x="${left}" y="${y+7}" width="${w}" height="${rowH-14}" rx="3" fill="var(--na-soft)"/>`;
    if(r.v!=null)s+=`<rect x="${left}" y="${y+7}" width="${Math.max(2,w*r.v)}" height="${rowH-14}" rx="3" fill="${col}"/>`;
    s+=`<text x="${r.v!=null?x(r.v)+6:left+6}" y="${y+rowH/2+4}" font-size="12" font-weight="600" fill="var(--ink)">${pct(r.v)}</text>`});
  return s+"</svg>"}

function kpisComp(fs){
  const cs=fs.map(f=>({f,c:calc(f)}));
  const ind=avg(cs.map(x=>x.c.ind));
  const ncs=fs.flatMap(f=>f.ncs||[]);const abertas=ncs.filter(n=>n.situacao!=="Corrigida");
  let func=fs.flatMap(f=>f.func||[]);let adm=func.filter(p=>p.mov==="Admissão"),des=func.filter(p=>p.mov==="Desligamento");
  let comp=func.filter(p=>p.docs==="Completa").length;
  const mv=mvAtual();if(mv){adm=mv.adm?.rows||[];des=mv.dem?.rows||[];func=[...adm,...des];comp=func.filter(r=>!r.st.some(x=>x==="NC"||x==="P")).length}
  return {cs,ind,ncs,abertas,altasAb:abertas.filter(n=>n.prioridade==="Alta").length,func,adm,des,comp,noPrazo:avg(cs.map(x=>x.c.noPrazo)),pastas:fs.reduce((s,f)=>s+(+f.pastas||0),0)}}

    <div class="card kpi"><span class="l">NCs em aberto</span><span class="v">${k.abertas.length}</span><span class="s">${k.altasAb} de prioridade alta · ${k.ncs.length} registradas</span></div>

  h+=cov;if(mvAtual())h+=movObraCard();

    <div class="tw"><table><thead><tr><th>Assistente</th><th>Empresa</th><th>Data</th><th class="n">Pastas</th><th class="n">Geral</th>${BLOCOS.map(b=>`<th class="n" title="${esc(b.nome)}">${b.k}</th>`).join("")}<th class="n">NC altas</th><th class="n">Sem marcação</th><th>Classificação</th></tr></thead><tbody>
    ${k.cs.map(({f,c})=>`<tr class="click" data-open="${esc(f.id)}"><td><b>${esc(f.assistente||"(sem nome)")}</b></td><td>${esc(curtoEmp(empresaDe(f.obra))||f.obra)}</td><td class="num">${fmtD(f.data)}</td><td class="n">${esc(f.pastas||"—")}</td><td class="n">${heat(c.ind)}</td>${BLOCOS.map(b=>`<td class="n">${heat(c.blocos[b.k].ind)}</td>`).join("")}<td class="n">${c.ncAltas}</td><td class="n">${c.sem}</td><td>${pill(c.ind)}</td></tr>`).join("")}

  h+=`<div class="card sec chart"><h2>Onde estão as falhas</h2><p class="hint">Índice médio de cada bloco do checklist nesta competência. Linhas tracejadas: 60% Atenção · 75% Bom · 90% Ótimo.</p>${chartBlocos(rows)}</div>`;
  const ab=fs.flatMap(f=>(f.ncs||[]).filter(n=>n.situacao!=="Corrigida").map(n=>({...n,f}))).sort((a,b)=>(a.prazo||"9").localeCompare(b.prazo||"9"));
  h+=`<div class="card sec"><h2>Pendências em aberto</h2>${ab.length?`<div class="tw"><table><thead><tr><th>Prazo</th><th>Prioridade</th><th>Item</th><th>Falha</th><th>Funcionário / processo</th><th>Assistente</th><th>Situação</th></tr></thead><tbody>

  el.innerHTML=h}

    ${lSel("func",i,"mov","Movimentação",r.mov,MOVS)}${lInp("func",i,"nome","Funcionário",r.nome)}${lInp("func",i,"matricula","Matrícula",r.matricula)}${lInp("func",i,"data","Data da movimentação",r.data,"date")}
    ${lSel("func",i,"docs","Documentação",r.docs,["","Completa","Pendente","Não localizada"])}
    <div class="wide">${lInp("func",i,"pendencias","Documentos faltantes ou pendências",r.pendencias)}</div>${rmBtn("func",i)}</div>`).join(""):`<div class="empty">Nenhuma movimentação registrada.</div>`;
  const nc=f.ncs||[];$("#l-ncs").innerHTML=nc.length?nc.map((r,i)=>`<div class="lrow">
    ${lSel("ncs",i,"item","Item",r.item,["",...Array.from({length:30},(_,j)=>String(j+1))])}${lSel("ncs",i,"prioridade","Prioridade",r.prioridade,["Alta","Média","Baixa"])}
    ${lInp("ncs",i,"prazo","Prazo para correção",r.prazo,"date")}${lSel("ncs",i,"situacao","Situação",r.situacao,["Aberta","Em andamento","Corrigida"])}${lInp("ncs",i,"correcao","Data da correção",r.correcao,"date")}
    <div class="wide">${lInp("ncs",i,"falha","Falha identificada",r.falha)}</div><div class="wide">${lInp("ncs",i,"funcionario","Funcionário ou processo",r.funcionario)}</div>${rmBtn("ncs",i)}</div>`).join(""):`<div class="empty">Nenhuma não conformidade registrada. Itens marcados como NC ou P mostram um atalho para registrar.</div>`;
  const pl=f.plano||[];$("#l-plano").innerHTML=pl.length?pl.map((r,i)=>`<div class="lrow">
    <div class="wide">${lInp("plano",i,"acao","Ação corretiva",r.acao)}</div>${lInp("plano",i,"responsavel","Responsável",r.responsavel)}${lInp("plano",i,"prazo","Prazo",r.prazo,"date")}${lInp("plano",i,"validacao","Data da validação",r.validacao,"date")}${rmBtn("plano",i)}</div>`).join(""):`<div class="empty">Nenhuma ação registrada.</div>`;}
function lInp(l,i,k,label,v,type="text"){return `<label class="fld"><span>${label}</span><input class="inp" id="${l}-${i}-${k}" data-l="${l}" data-i="${i}" data-k="${k}" type="${type}" value="${esc(v??"")}" ${dis()}></label>`}
function lSel(l,i,k,label,v,opts){return `<label class="fld"><span>${label}</span><select class="inp" id="${l}-${i}-${k}" data-l="${l}" data-i="${i}" data-k="${k}" ${dis()}>${opts.map(o=>`<option ${o===(v??"")?"selected":""} value="${esc(o)}">${esc(o||"—")}</option>`).join("")}</select></label>`}
function rmBtn(l,i){return `<button class="btn ghost sm rm" data-rm="${l}" data-i="${i}" ${dis()}>Remover</button>`}

function refreshCalc(f){
  const c=calc(f);const r=reinc(f);
  $("#sum").innerHTML=`<div class="k"><span>Assistente</span><b>${esc(f.assistente||"—")}</b></div><div class="k"><span>Índice geral</span><b>${pct(c.ind)}</b></div><div class="k"><span>Classificação</span><b>${pill(c.ind)}</b></div>
    <div class="k"><span>Sem marcação</span><b>${c.sem}</b></div><div class="k"><span>NC altas</span><b>${c.ncAltas}</b></div><div class="k"><span>Reincidências</span><b>${r==null?"—":r}</b></div><span class="status" id="st" style="margin-left:auto">${esc(saveMsg)}</span>`;
  for(const b of BLOCOS)$("#bi-"+b.k).innerHTML=heat(c.blocos[b.k].ind);
  $("#res").innerHTML=`<table><thead><tr><th>Bloco</th><th class="n">C</th><th class="n">P</th><th class="n">NC</th><th class="n">NA</th><th class="n">Aplicáveis</th><th class="n">Índice</th></tr></thead><tbody>
   ${BLOCOS.map(b=>{const o=c.blocos[b.k];return `<tr><td>${b.k}. ${esc(b.curto)}</td><td class="n">${o.C}</td><td class="n">${o.P}</td><td class="n">${o.NC}</td><td class="n">${o.NA}</td><td class="n">${o.ap}</td><td class="n">${heat(o.ind)}</td></tr>`}).join("")}
   <tr><td><b>Total</b></td><td class="n"><b>${c.C}</b></td><td class="n"><b>${c.P}</b></td><td class="n"><b>${c.NC}</b></td><td class="n"><b>${c.NA}</b></td><td class="n"><b>${c.ap}</b></td><td class="n">${heat(c.ind)}</td></tr></tbody></table>`;
  const temNc=new Set((f.ncs||[]).map(n=>String(n.item)));
  for(let i=1;i<=30;i++){const v=(f.resp||{})[i];const sp=$("#an-"+i);if(!sp)continue;
    sp.innerHTML=(v==="NC"||v==="P")&&!temNc.has(String(i))&&state.canWrite?`<button class="btn sm" data-ncfrom="${i}">+ Registrar não conformidade do item ${i}</button>`:""}}

/* ---------- persistência ---------- */
let saveMsg="";const timers={};
function setStatus(t,err){saveMsg=t;for(const id of ["st","st2"]){const s=$("#"+id);if(s){s.textContent=t;s.classList.toggle("err",!!err)}}}
function schedule(f,ms=700){f.atualizadoEm=new Date().toISOString();f._dirty=true;setStatus("Salvando…");clearTimeout(timers[f.id]);timers[f.id]=setTimeout(()=>persist(f),ms)}
let chain=Promise.resolve();
function persist(f){chain=chain.then(async()=>{if(!state.db){setStatus("Sem conexão com o armazenamento: as alterações não foram salvas.",true);return}
  const {_dirty,...body}=f;try{await state.db.doc("fichas/"+f.id).set(JSON.parse(JSON.stringify(body)));f._dirty=false;setStatus("Salvo às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}))}
  catch(e){if(e&&e.code==="invalid_argument"&&!state.canWriteChecked){state.canWrite=false;$("#ro").hidden=false;render()}
    setStatus(e&&e.code==="quota_exceeded"?"Armazenamento cheio: exclua fichas antigas para salvar.":"Não foi possível salvar. Tente de novo.",true)}})}
function curF(){return state.fichas.find(x=>x.id===state.sel)}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,tr[data-open]");if(!t)return;
  if(t.dataset.open){state.sel=t.dataset.open;location.hash="#fichas";if(state.view==="fichas")render();setTimeout(()=>$("#editor")?.scrollIntoView({behavior:"smooth",block:"start"}),60);return}
  if(t.dataset.act==="nova"){if(!state.canWrite)return;const f={id:uid(),competencia:state.comp,assistente:"",obra:"",cnpj:"",auditor:"",data:hoje().slice(0,7)===state.comp?hoje():state.comp+"-01",tipo:"Mensal (amostragem)",ativos:"",pastas:"",resp:{},obs:{},ncs:[],plano:[],func:[],parecer:{},criadoEm:new Date().toISOString()};
    state.fichas.push(f);state.sel=f.id;if(location.hash!=="#fichas")location.hash="#fichas";else render();schedule(f,0);setTimeout(()=>{$("#f-assistente")?.focus();$("#editor")?.scrollIntoView({block:"start"})},80);return}
  if(t.dataset.sel){envio.view=null;state.sel=t.dataset.sel;rFichas();$("#editor")?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const f=curF();
  if(t.dataset.item&&f){const i=t.dataset.item,v=t.dataset.v;f.resp=f.resp||{};if(f.resp[i]===v)delete f.resp[i];else f.resp[i]=v;
    t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(f.resp[i]===b.dataset.v)));refreshCalc(f);schedule(f);return}
  if(t.dataset.ncfrom&&f){const i=t.dataset.ncfrom;const pr=f.resp[i]==="NC"?"Alta":"Média";f.ncs=f.ncs||[];f.ncs.push({id:uid(),item:String(i),falha:(f.obs||{})[i]||"",prioridade:pr,funcionario:"",prazo:prazoPara(f.data,pr),situacao:"Aberta",correcao:""});renderLists(f);refreshCalc(f);schedule(f);$("#ncs-"+(f.ncs.length-1)+"-falha")?.focus();return}
  if(t.dataset.add&&f){const l=t.dataset.add;f[l]=f[l]||[];
    if(l==="func")f.func.push({id:uid(),mov:t.dataset.mov,nome:"",matricula:"",data:"",docs:"",pendencias:""});
    if(l==="ncs")f.ncs.push({id:uid(),item:"",falha:"",prioridade:"Média",funcionario:"",prazo:prazoPara(f.data,"Média"),situacao:"Aberta",correcao:""});
    if(l==="plano")f.plano.push({id:uid(),acao:"",responsavel:f.assistente||"",prazo:"",validacao:""});
    renderLists(f);refreshCalc(f);schedule(f);const k=l==="func"?"nome":l==="ncs"?"falha":"acao";$(`#${l}-${f[l].length-1}-${k}`)?.focus();return}
  if(t.dataset.rm&&f){f[t.dataset.rm].splice(+t.dataset.i,1);renderLists(f);refreshCalc(f);schedule(f);return}
  if(t.dataset.act==="del"&&f){$("#delbox").innerHTML=`<span class="confirm">Excluir a ficha de ${esc(f.assistente||"(sem nome)")}? <button class="btn danger sm" data-act="del2">Excluir</button><button class="btn ghost sm" data-act="delno">Cancelar</button></span>`;return}
  if(t.dataset.act==="delno"){$("#delbox").innerHTML=`<button class="btn danger" data-act="del">Excluir ficha</button>`;return}
  if(t.dataset.act==="del2"&&f){clearTimeout(timers[f.id]);state.fichas=state.fichas.filter(x=>x.id!==f.id);state.sel=null;render();try{await state.db?.doc("fichas/"+f.id).delete()}catch(_){setStatus("Não foi possível excluir.",true)}return}
  if(t.dataset.act==="baixar-html")return baixarHTML();
  if(t.dataset.act==="baixar-csv")return baixarCSV();
});
function setPath(o,path,v){const ks=path.split(".");let c=o;for(let j=0;j<ks.length-1;j++){c[ks[j]]=c[ks[j]]||{};c=c[ks[j]]}c[ks.at(-1)]=v}
document.addEventListener("input",e=>{const t=e.target;const f=curF();if(!f)return;
  if(t.dataset.f){setPath(f,t.dataset.f,t.value);if(t.dataset.f==="assistente")refreshCalc(f);schedule(f)}
  else if(t.dataset.obs){f.obs=f.obs||{};f.obs[t.dataset.obs]=t.value;schedule(f)}
  else if(t.dataset.l){const r=f[t.dataset.l][+t.dataset.i];r[t.dataset.k]=t.value;
    if(t.dataset.l==="ncs"&&t.dataset.k==="prioridade"){r.prazo=prazoPara(f.data,t.value);const p=$(`#ncs-${t.dataset.i}-prazo`);if(p)p.value=r.prazo}
    if(t.dataset.l==="ncs"&&t.dataset.k==="situacao"&&t.value==="Corrigida"&&!r.correcao){r.correcao=hoje();const p=$(`#ncs-${t.dataset.i}-correcao`);if(p)p.value=r.correcao}
    if(t.dataset.l==="ncs"&&["prioridade","item","situacao"].includes(t.dataset.k))refreshCalc(f);
    schedule(f)}});

function relatorioHTML(){
  const fs=doComp();const k=kpisComp(fs);const cl=compLabel(state.comp);
  const auditores=[...new Set(fs.map(f=>f.auditor).filter(Boolean))].join(", ")||"—";
  const obras=[...new Set(fs.map(f=>f.obra).filter(Boolean))].join(", ")||"—";
  const prevComp=[...new Set(state.fichas.map(f=>f.competencia))].filter(c=>c<state.comp).sort().pop();
  // itens mais críticos
  const itemStats=[];for(let i=1;i<=30;i++){let nc=0,p=0,ap=0;for(const f of fs){const r=(f.resp||{})[i];if(r==="NC")nc++;if(r==="P")p++;if(r&&r!=="NA")ap++}if(nc+p)itemStats.push({i,nc,p,ap})}
  itemStats.sort((a,b)=>b.nc-a.nc||b.p-a.p);

  const mv=mvAtual();let sn=0;const N=()=>++sn;
  const listaMov=(mov)=>{if(mv)return movSecao(mv,mov==="Admissão"?"adm":"dem");const l=func.filter(p=>p.mov===mov);return l.length?`<div class="tw"><table><thead><tr><th>Funcionário</th><th>Matrícula</th><th>Data</th><th>Assistente / obra</th><th>Documentação</th><th>Pendências</th></tr></thead><tbody>${l.map(p=>`<tr><td>${esc(p.nome||"—")}</td><td>${esc(p.matricula||"—")}</td><td class="num">${fmtD(p.data)}</td><td>${esc(p.f.assistente)}${p.f.obra?" · "+esc(p.f.obra):""}</td><td>${p.docs==="Completa"?'<span class="pill p-otimo">Completa</span>':p.docs==="Pendente"?'<span class="pill p-atencao">Pendente</span>':p.docs==="Não localizada"?'<span class="pill p-critico">Não localizada</span>':'<span class="pill p-none">Não informado</span>'}</td><td>${esc(p.pendencias||"")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Nenhuma ${mov==="Admissão"?"admissão":"rescisão"} registrada nesta competência.</p>`};
  const conf=(mov)=>{if(mv){const l=mv[mov==="Admissão"?"adm":"dem"].rows;const c=l.filter(r=>!r.st.some(x=>x==="NC"||x==="P")).length;return l.length?`${c} de ${l.length} sem documento NC ou P`:"sem registros"}const l=func.filter(p=>p.mov===mov);const c=l.filter(p=>p.docs==="Completa").length;return l.length?`${c} de ${l.length} (${pct(c/l.length)}) com documentação completa`:"sem registros"};
  return `<article class="report" id="report">
   <header class="rcover"><div class="top-r"><span><img class="logo-light" alt="Rio Ave" src="${$(".top .logo-light").src}"><img class="logo-dark" alt="Rio Ave" src="${$(".top .logo-dark").src}"></span><span class="eyebrow">Departamento Pessoal</span></div>
     <h1>Relatório de Conformidade Documental<br>Competência ${esc(cl)}</h1>
     <div class="rmeta"><div><span>Escopo</span>Documentação admissional, contratual e rescisória</div><div><span>Empresas auditadas</span>${esc(cobertura().filter(x=>x.na+x.nd||x.f.length).map(x=>curtoEmp(x.e)).join(", ")||"—")}</div><div><span>Auditor(es)</span>${esc(auditores!=="—"?auditores:(mv&&mv.auditor)||"—")}</div><div><span>Emitido em</span>${fmtD(hoje())}</div></div></header>
   <section class="rsec"><h2>${N()}. Resumo</h2>
     ${mv?`<p>Planilha de movimentações importada (${esc(mv.arquivo||"")}): <b>${mv.adm.rows.length}</b> admissões com índice admissional de <b>${pct(agrega(mv.adm.rows).ind)}</b> e <b>${mv.dem.rows.length}</b> desligamentos com índice demissional de <b>${pct(agrega(mv.dem.rows).ind)}</b>.</p>`:""}
     ${fs.length?`<p>Foram auditadas <b>${fs.length}</b> ficha${fs.length>1?"s":""} de assistente, com <b>${k.pastas}</b> pastas verificadas, <b>${k.adm.length}</b> admissões e <b>${k.des.length}</b> desligamentos conferidos. O índice geral médio foi de <b>${pct(k.ind)}</b>, classificação <b>${faixa(k.ind)?.nome||"sem dados"}</b>.${pior?` O bloco com menor índice foi <b>${pior.b.k}. ${esc(pior.b.nome)}</b> (${pct(pior.v)}).`:""} Ficaram <b>${k.abertas.length}</b> não conformidades em aberto, ${k.altasAb} de prioridade alta.</p>`:mv?"":`<p class="muted">Nenhuma ficha registrada nesta competência. Crie as fichas na aba Fichas ou importe a planilha na aba Movimentações para gerar o relatório.</p>`}

   ${fs.length?`<section class="rsec"><h2>${N()}. Resultado por assistente</h2><div class="tw"><table><thead><tr><th>Assistente</th><th>Obra</th><th class="n">Pastas</th><th class="n">Geral</th>${BLOCOS.map(b=>`<th class="n">${b.k}</th>`).join("")}<th class="n">NC altas</th><th class="n">Reinc.</th><th>Classificação</th></tr></thead><tbody>
     ${k.cs.map(({f,c})=>{const r=reinc(f);return `<tr><td><b>${esc(f.assistente||"—")}</b></td><td>${esc(f.obra)}</td><td class="n">${esc(f.pastas||"—")}</td><td class="n">${heat(c.ind)}</td>${BLOCOS.map(b=>`<td class="n">${heat(c.blocos[b.k].ind)}</td>`).join("")}<td class="n">${c.ncAltas}</td><td class="n">${r==null?"—":r}</td><td>${pill(c.ind)}</td></tr>`}).join("")}</tbody></table></div>

function rc(r){const o={C:0,P:0,NC:0,NA:0};for(const x of r.st)if(o[x]!=null)o[x]++;o.ap=o.C+o.P+o.NC;o.ind=o.ap?o.C/o.ap:null;return o}
function agrega(rows){const o={n:rows.length,C:0,P:0,NC:0,NA:0};for(const r of rows){const c=rc(r);o.C+=c.C;o.P+=c.P;o.NC+=c.NC;o.NA+=c.NA}o.ap=o.C+o.P+o.NC;o.ind=o.ap?o.C/o.ap:null;return o}

function emailFicha(f){const c=calc(f);const fx=faixa(c.ind);const nm=primeiroNome(f.assistente)||"tudo bem";const h=new Date().getHours();const sd=h<12?"bom dia":h<18?"boa tarde":"boa noite";
  const emp=curtoEmp(empresaDe(f.obra))||f.obra||"";const obra=emp+(f.empreendimento?` (${f.empreendimento})`:"");
  const fr={otimo:"demonstrando que os processos e documentos verificados estão organizados e atendem aos padrões estabelecidos.",
    bom:"demonstrando que, de modo geral, os processos e documentos verificados estão organizados e atendem aos padrões estabelecidos. Contudo, foram identificados alguns pontos que necessitam de ajustes:",
    atencao:"indicando que parte dos processos e documentos verificados precisa de ajustes para atender aos padrões estabelecidos. Foram identificados os seguintes pontos:",
    critico:"indicando falhas relevantes na organização e na formalização dos documentos verificados, que precisam ser regularizadas com prioridade. Foram identificados os seguintes pontos:"}[fx?.c]||"Seguem os pontos identificados:";
  const ab=(f.ncs||[]).filter(n=>n.situacao!=="Corrigida");const ord={Alta:0,"Média":1,Baixa:2};ab.sort((a,b)=>(ord[a.prioridade]??3)-(ord[b.prioridade]??3));
  const pts=[];for(const n of ab.filter(n=>!n.auto))pts.push(`${(n.falha||"").replace(/\.$/,"")}${n.funcionario?` (${n.funcionario})`:""} – prioridade ${String(n.prioridade||"").toLowerCase()}, prazo ${fmtD(n.prazo)}.`);
  const resumoNC=n=>{const m=(n.falha||"").match(/^(.*?):\s*(?:não conforme|parcial) em (\d+) de (\d+) (\S+)/);if(n.key==="pasta")return `pasta não localizada (${(n.falha.match(/para (\d+ de \d+)/)||[])[1]||""} colaboradores)`;return m?`${m[1]} (${m[2]} de ${m[3]} ${m[4].replace(/\.$/,"")})`:(n.falha||"").replace(/\.$/,"")};
  const auto=ab.filter(n=>n.auto);
  for(const [pr,txt] of [["Alta","Documentos ausentes ou não conformes – prioridade alta"],["Média","Documentos ausentes ou não conformes – prioridade média"],["Baixa","Documentos com pendência parcial – prioridade baixa"]]){
    const g=auto.filter(n=>n.prioridade===pr);if(!g.length)continue;const pz=[...new Set(g.map(n=>fmtD(n.prazo)))].join(", ");
    pts.push(`${txt} (prazo ${pz}): ${g.map(resumoNC).join("; ")}.`)}
  const cobertos=new Set(ab.map(n=>String(n.item)));
  for(let i=1;i<=30;i++){const r=(f.resp||{})[i];const o=((f.obs||{})[i]||"").trim();if((r==="P"||r==="NC")&&o&&!cobertos.has(String(i))&&!/\(movimenta/.test(o))pts.push(`${ITENS[i].replace(/\.$/,"")}: ${o.replace(/\.$/,"")}.`)}
  const altas=ab.filter(n=>n.prioridade==="Alta");
  const assunto=`Devolutiva – Checklist de Conformidades - ${obra}${f.assistente?" - "+f.assistente:""}`;
  const corpo=[`Olá, ${nm}, ${sd}!`,"",
   `Conforme auditoria realizada em ${fmtD(f.data)}, nas pastas funcionais e documentos do Departamento Pessoal referentes à ${obra}, competência ${compLabel(f.competencia).toLowerCase()}, encaminho a devolutiva dos pontos identificados no Checklist de Conformidades.`,"",
   `A auditoria apresentou um índice geral de ${pct(c.ind)}, classificação ${fx?.nome||"sem dados"}, ${fr}`,
   ...(pts.length?["","Pontos de atenção identificados:",...pts.map(x=>"• "+x)]:["","Não foram identificadas pendências nesta auditoria."]),
   ...((f.func||[]).length?["",`Foram conferidas ${f.func.filter(x=>x.mov==="Admissão").length} admissões e ${f.func.filter(x=>x.mov==="Desligamento").length} desligamentos da competência. A relação de cada colaborador, com as pendências, está no anexo da ficha.`]:[]),
   ...(pts.length?["",`Solicito atenção especial aos ajustes apontados${altas.length?`, principalmente ${altas.length===1?"à pendência de prioridade alta":"às "+altas.length+" pendências de prioridade alta"}`:""}, bem como ao cumprimento dos prazos estabelecidos na checklist, para que as correções sejam realizadas e posteriormente validadas.`,"",
     "É importante que os pontos identificados sejam tratados com atenção e que as datas mencionadas sejam respeitadas, contribuindo para a manutenção da conformidade dos processos, a segurança das informações e a padronização das rotinas do Departamento Pessoal.",
     "Após a realização dos ajustes, peço que me retorne com a confirmação da regularização dos itens apontados, para acompanhamento e validação."]:[]),
   "Por favor, responda a este e-mail com “Ciente”, confirmando o recebimento e ciência dos pontos apresentados.",
   "Agradeço pela colaboração e pelo compromisso com a melhoria contínua dos nossos processos.","","Atenciosamente,",f.auditor||""].join("\n");
  return {assunto,corpo}}

  return {doc:p=>({set:d=>fs.doc(p).set(limpa(d)),update:d=>fs.doc(p).set(limpa(d),{merge:true}),delete:()=>fs.doc(p).delete()}),
          collection:p=>({onSnapshot:(ok,err)=>fs.collection(p).onSnapshot(ok,err),get:()=>fs.collection(p).get()})}}
const avisoDb=t=>{const m=$("#dbmsg");m.hidden=false;m.textContent=t};
route();
(async()=>{
  if(FIREBASE_CONFIG.apiKey.indexOf("COLE")===0){state.loaded=true;avisoDb("Configuração do Firebase pendente: preencha FIREBASE_CONFIG no index.html (veja o LEIAME).");render();return}
  try{await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");firebase.initializeApp(FIREBASE_CONFIG)}
  catch(_){state.loaded=true;avisoDb("Não foi possível conectar ao banco (Firebase). Verifique a conexão e recarregue a página.");render();return}
  const db=dbDe(firebase.firestore());
  state.db=db;subLinhas();
  const tm=setTimeout(()=>{if(!state.loaded){$("#dbmsg").hidden=false;$("#dbmsg").textContent="Ainda sem resposta do armazenamento. Os dados aparecem assim que a conexão voltar."}},10000);
  db.collection("movimentacoes").onSnapshot(snap=>{for(const k of Object.keys(MOV))delete MOV[k];for(const d of snap.docs)MOV[d.id]=structuredClone(d.data());linVer++;
    if(state.loaded)softRender()},()=>{});
  db.collection("fichas").onSnapshot(snap=>{
    const local=new Map(state.fichas.map(f=>[f.id,f]));const strip=o=>{const {_dirty,...b}=o||{};return JSON.stringify(b)};let selChanged=false;
    state.fichas=snap.docs.map(d=>{const l=local.get(d.id);if(l&&l._dirty)return l;const n={...structuredClone(d.data()),id:d.id};
      if(l&&strip(l)===strip(n))return l;if(d.id===state.sel)selChanged=true;return n});
    for(const f of local.values())if(f._dirty&&!state.fichas.find(x=>x.id===f.id))state.fichas.push(f);
    if(!snap.metadata.fromCache){clearTimeout(tm);$("#dbmsg").hidden=true}
    state.loaded=true;
    const ed=$("#editor");
    if(state.view==="fichas"&&ed&&curF()&&$("#fcards")){$("#fcards").innerHTML=cardsHTML(doComp());const editing=ed.contains(document.activeElement);if(selChanged&&!editing)renderEditor();else refreshCalc(curF());return}
    render()},
   err=>{clearTimeout(tm);state.loaded=true;$("#dbmsg").hidden=false;$("#dbmsg").textContent="Não foi possível carregar as fichas salvas.";render()});
})();
</script>
